# Battle-map terrain of the original mode, learned from the battle maps of the player's
# copy by `hero-tools original pack` (do not edit; run the importer again). One 32-px tile
# is one 2×2-chip cell of the original maps, the grid units move on. An `auto` layer picks
# the tile by the mask of orthogonal neighbours in `connect` (1 = north, 2 = east,
# 4 = south, 8 = west; outside the map counts as connected, docs/ASSETS.md); each tile is
# the block the original maps show most often for that terrain and mask.

tile_size = 32
image = "terrain.png"

# plain: plain, 10516 cells in the original maps
[tiles.plain]
layers = [
  { cells = [[0, 0]] },
]

# grass: grass, 3791 cells in the original maps
[tiles.grass]
layers = [
  { auto = [[1, 0], [2, 0], [3, 0], [3, 0], [4, 0], [5, 0], [6, 0], [5, 0], [2, 0], [5, 0], [5, 0], [5, 0], [7, 0], [5, 0], [5, 0], [5, 0]], connect = ["grass"] },
]

# road: plain, 10516 cells in the original maps
[tiles.road]
layers = [
  { cells = [[0, 0]] },
]

# forest: forest, 4606 cells in the original maps
[tiles.forest]
layers = [
  { auto = [[8, 0], [9, 0], [10, 0], [11, 0], [12, 0], [13, 0], [14, 0], [15, 0], [0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [13, 0], [3, 1], [5, 1]], connect = ["forest"] },
]

# mountain: mountain, 2963 cells in the original maps
[tiles.mountain]
layers = [
  { auto = [[6, 1], [7, 1], [6, 1], [8, 1], [9, 1], [10, 1], [11, 1], [10, 1], [12, 1], [13, 1], [10, 1], [14, 1], [15, 1], [14, 1], [10, 1], [0, 2]], connect = ["mountain"] },
]

