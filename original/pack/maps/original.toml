# `hero-tools original pack` (do not edit; run the importer again). A battle plays on one
# with `[map] use = "<id>"`; the id keeps the map's entry number, which the scenario
# scripts use. Each map has a picture layer, gfx/maps/<id>.png (the map's 16-px chips as
# the game draws them, so one 32-px tile is one 2×2-chip cell), and a rules grid made
# from the map's terrain bytes: one character per cell, the original terrain code in
# base 36 (docs/reverse-engineering/FORMATS.md §10.4), with `legend` naming its terrain.

