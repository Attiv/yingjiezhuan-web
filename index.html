<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>三國志英傑傳</title>
    <link rel="icon" href="data:," />
    <link rel="preload" href="/assets/font/fusion-pixel-12px-zh_hans.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <main id="stage">
      <div id="map" aria-label="战场"></div>
      <aside id="side">
        <div id="turn"></div>
        <section id="unit" aria-live="polite"></section>
        <div id="tile"></div>
        <nav id="sys" aria-label="系统指令"></nav>
      </aside>
      <section id="minimap-box" aria-label="战场全图">
        <div class="map-label">战场全图</div>
        <canvas id="minimap" tabindex="0" aria-label="战场小地图，点击定位，拖动金框或用方向键移动镜头" title="点按定位 · 拖动金框"></canvas>
      </section>
      <div id="log" role="log" aria-label="战况"></div>
      <div id="banner" hidden></div>
      <div id="clash" hidden></div>
      <div id="duel" hidden aria-hidden="true"></div>
      <div id="duelplay" hidden aria-hidden="true"></div>
      <div id="menu" role="menu" hidden></div>
      <div id="talk" hidden></div>
      <div id="screen" hidden></div>
      <div id="gate" hidden></div>
      <div id="trainer" hidden></div>
      <div id="guide" hidden></div>
    </main>
    <nav id="touch-controls" aria-label="触屏操作">
      <button id="touch-log" class="btn" aria-expanded="false" aria-controls="log">战况</button>
      <button id="touch-cancel" class="btn">取消</button>
      <button id="touch-system" class="btn" aria-expanded="false" aria-controls="sys">系统</button>
    </nav>
    <div id="rotate-hint" role="status">横屏游玩更清楚 · 单指拖动战场移动镜头</div>
    <div id="safe-area" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
